[workspace]
members = [
  "crates/assurance-schema",
  "crates/assurance-adapter",
  "crates/assurance-subject",
  "crates/assurance-core",
  "crates/assurance-evidence",
  "crates/assurance-sandbox",
  "crates/assurance-campaign",
  "crates/assurance-fault",
  "crates/assurance-mutation",
  "crates/assurance-privacy",
  "crates/assurance-report",
  "crates/assurance-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/toorik2/ShieldKit-Assurance"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
hex = "0.4.3"
schemars = "1.0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_json_canonicalizer = "0.3.1"
sha2 = "0.10.9"
sha1 = "0.10.6"
tar = "0.4.44"
tempfile = "3.23.0"
thiserror = "2.0.17"
wait-timeout = "0.2.1"
walkdir = "2.5.0"
rustix = { version = "1.1.4", features = ["fs", "pipe"] }
